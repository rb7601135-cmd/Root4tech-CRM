<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Root4Tech CRM</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      background: radial-gradient(circle at 10% 20%, #0b1120 0%, #060913 90%);
    }
    .login-card-wrapper {
      width: 100%;
      max-width: 480px;
      margin: auto;
      padding: 2.5rem;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-card-wrapper">
    <!-- Brand Logo -->
    <div class="text-center mb-4">
      <img src="assets/images/logo.svg" alt="Root4Tech Logo" class="brand-logo-img mb-3" style="height: 48px;">
      <h4 class="text-white fw-bold mb-1">Agency Portal Login</h4>
      <p class="text-secondary small">Internal CRM for Root4Tech Staff & Management</p>
    </div>

    <!-- Login Form -->
    <div class="card bg-dark border border-secondary border-opacity-25 shadow-lg p-4 mb-4 text-white rounded-4">
      <form id="loginForm" onsubmit="handleFormLogin(event)">
        <div class="mb-3">
          <label class="form-label small text-secondary fw-semibold">Work Email or Username</label>
          <div class="input-group">
            <span class="input-group-text bg-secondary bg-opacity-10 border-secondary border-opacity-25 text-secondary"><i class="bi bi-envelope"></i></span>
            <input type="text" id="loginEmail" class="form-control bg-dark text-white border-secondary border-opacity-25" placeholder="e.g. yourname@root4tech.com or username" required autocomplete="username">
          </div>
        </div>
        <div class="mb-3">
          <div class="d-flex justify-content-between">
            <label class="form-label small text-secondary fw-semibold">Password</label>
            <a href="#" class="text-primary small text-decoration-none" onclick="showToast('Contact system administrator to reset credentials.', 'info'); return false;">Forgot?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-secondary bg-opacity-10 border-secondary border-opacity-25 text-secondary"><i class="bi bi-lock"></i></span>
            <input type="password" id="loginPassword" class="form-control bg-dark text-white border-secondary border-opacity-25" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input bg-secondary bg-opacity-25 border-secondary" type="checkbox" id="rememberMe" checked>
          <label class="form-check-label text-secondary small" for="rememberMe">Remember my session</label>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow">
          Sign In to Dashboard <i class="bi bi-arrow-right ms-1"></i>
        </button>
      </form>
    </div>

    <div class="text-center text-secondary small">
      &copy; 2026 Root4Tech Digital Agency. Production Portal.
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  async function handleFormLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    if (!email || !password) {
      showToast('Please enter both your email/username and password.', 'warning');
      return;
    }

    if (window.CRM_API) {
      try {
        const res = await CRM_API.login(email, password);
        if (res && res.success) {
          showToast(`Login successful! Welcome back, ${res.user.name}.`, 'success');
          setTimeout(() => { window.location.href = 'index.html'; }, 350);
          return;
        }
      } catch (err) {
        console.warn('[Login] Backend notice:', err.message);
        if (err.message && err.message.toLowerCase().includes('invalid credentials')) {
          showToast('Invalid credentials. Please verify your email and password.', 'danger');
          return;
        }
        // For temporary server/database errors, proceed to localized store authentication below
      }
    }

    // Fallback for purely static environments
    if (typeof CRM_STORE !== 'undefined') {
      const data = CRM_STORE.get() || {};
      const team = data.teamMembers || [];
      const cleanInput = email.toLowerCase();
      const matchedUser = team.find(m => 
        (m.email && m.email.toLowerCase() === cleanInput) ||
        (m.roleKey && m.roleKey.toLowerCase() === cleanInput)
      );

      if (matchedUser) {
        CRM_STORE.setCurrentRole(matchedUser.roleKey);
        showToast(`Login successful! Welcome back, ${matchedUser.name}.`, 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 350);
        return;
      }
    }

    showToast('Invalid credentials. Please verify your email and password.', 'danger');
  }
</script>
</script>
</body>
</html>
