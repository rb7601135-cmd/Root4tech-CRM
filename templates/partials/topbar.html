<header id="topbar">
  <div class="topbar-left">
    <button class="btn btn-icon d-lg-none" id="mobile-sidebar-toggle-btn">
      <i class="bi bi-list fs-5"></i>
    </button>
    <button class="search-trigger-btn" data-bs-toggle="modal" data-bs-target="#globalSearchModal">
      <i class="bi bi-search"></i>
      <span>Search CRM...</span>
      <span class="kbd-shortcut">Ctrl K</span>
    </button>
  </div>

  <div class="topbar-right">
    <!-- Active Staff Role Badge -->
    <div class="role-badge-selector static-badge" title="Active Role">
      <i class="bi bi-person-badge-fill text-primary"></i>
      <span class="text-secondary small">Role:</span>
      <span id="current-role-badge-text" class="fw-bold">Sales Manager</span>
    </div>

    <!-- Topbar Actions Block (Quick Add / Action Button) -->
    {% block topbar_actions %}
    <div class="dropdown">
      <button class="btn btn-primary btn-sm rounded-pill px-3 d-flex align-items-center gap-1 dropdown-toggle" type="button" data-bs-toggle="dropdown">
        <i class="bi bi-plus-lg"></i>
        <span class="d-none d-sm-inline">Create</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow border-0 p-2">
        <li><a class="dropdown-item rounded" href="#" data-bs-toggle="modal" data-bs-target="#newLeadModal"><i class="bi bi-funnel me-2 text-primary"></i> New Lead</a></li>
        <li><a class="dropdown-item rounded" href="#" data-bs-toggle="modal" data-bs-target="#newProjectModal"><i class="bi bi-briefcase me-2 text-info"></i> New Project</a></li>
        <li><a class="dropdown-item rounded" href="#" data-bs-toggle="modal" data-bs-target="#newTaskModal"><i class="bi bi-check2-square me-2 text-warning"></i> New Task</a></li>
      </ul>
    </div>
    {% endblock %}

    <!-- Notification Bell -->
    <a href="/notifications.html" class="btn btn-icon position-relative">
      <i class="bi bi-bell"></i>
      <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="topbar-notif-badge" style="font-size: 0.65rem;">
        3
      </span>
    </a>

    <!-- User Profile Dropdown -->
    <div class="dropdown">
      <button class="btn p-0 border-0" type="button" data-bs-toggle="dropdown">
        <div class="user-avatar current-user-avatar" style="background-color: #059669;">SS</div>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow border-0 p-2" style="min-width: 200px;">
        <li class="px-3 py-2 border-bottom mb-1">
          <div class="fw-bold current-user-name">Sir Sharjeel</div>
          <div class="text-muted small current-user-role">Sales Manager</div>
        </li>
        <li><a class="dropdown-item rounded" href="/settings.html"><i class="bi bi-person me-2"></i> My Profile</a></li>
        <li><a class="dropdown-item rounded" href="/settings.html"><i class="bi bi-gear me-2"></i> Settings</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item rounded text-danger" href="/login.html" onclick="handleLogout()"><i class="bi bi-box-arrow-right me-2"></i> Sign Out</a></li>
      </ul>
    </div>
  </div>
</header>
