<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Root4Tech CRM{% endblock %}</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
  {% block extra_css %}{% endblock %}
  {% block extra_head %}{% endblock %}
</head>
<body data-active-page="{% block active_page %}dashboard{% endblock %}">

<div id="app-wrapper">
  <!-- Sidebar Backdrop for mobile -->
  <div class="sidebar-backdrop"></div>

  <!-- Sidebar Component -->
  {% include "partials/sidebar.html" %}

  <!-- Main Content Wrap -->
  <div id="main-content">
    <!-- Topbar Component -->
    {% include "partials/topbar.html" %}

    <main class="page-container">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<!-- ==========================================================================
     GLOBAL MODALS
     ========================================================================== -->

<!-- Global Quick Search Modal -->
<div class="modal fade" id="globalSearchModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered search-modal-dialog">
    <div class="modal-content search-modal-content">
      <div class="search-input-header">
        <i class="bi bi-search text-secondary fs-5"></i>
        <input type="text" id="global-search-input" class="search-input-box" placeholder="Search leads, projects, clients, or tasks..." autocomplete="off">
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div id="global-search-results" class="search-results-list">
        <!-- Injected by search engine -->
      </div>
      <div class="p-2 border-top bg-light text-muted small d-flex justify-content-between px-3">
        <span>Navigation: <kbd class="bg-white text-dark border">↑</kbd> <kbd class="bg-white text-dark border">↓</kbd></span>
        <span>Press <kbd class="bg-white text-dark border">ESC</kbd> to exit</span>
      </div>
    </div>
  </div>
</div>

{% block modals %}{% endblock %}

<!-- Global Toast Container -->
<div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999;"></div>

<!-- Bootstrap 5 Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- SortableJS -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<!-- Application Data & Engines -->
<script src="/js/data.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
