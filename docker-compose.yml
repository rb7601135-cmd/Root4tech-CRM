version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: roo4tech_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roo4tech_crm}
      POSTGRES_USER: ${POSTGRES_USER:-roo4tech_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecureDatabasePassword123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roo4tech_admin -d roo4tech_crm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_internal_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roo4tech_crm_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-roo4tech_admin}:${POSTGRES_PASSWORD:-SecureDatabasePassword123!}@db:5432/${POSTGRES_DB:-roo4tech_crm}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - backup_volume:/app/backups
    networks:
      - crm_internal_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roo4tech_crm_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    networks:
      - crm_internal_net

  nginx:
    image: nginx:1.25-alpine
    container_name: roo4tech_crm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/var/www/staticfiles:ro
      - media_volume:/var/www/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - crm_internal_net

volumes:
  postgres_data:
    name: roo4tech_crm_pgdata
  static_volume:
    name: roo4tech_crm_static
  media_volume:
    name: roo4tech_crm_media
  backup_volume:
    name: roo4tech_crm_backups

networks:
  crm_internal_net:
    name: roo4tech_crm_network
    driver: bridge
